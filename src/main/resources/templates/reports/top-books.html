<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Top sách')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container col-lg-7">
    <h1 class="h3 mb-3">Top 5 sách được mượn nhiều nhất</h1>
    <table class="table bg-white">
        <thead><tr><th>Sách</th><th>Số cuốn đã cho mượn</th></tr></thead>
        <tbody>
        <tr th:each="item : ${books}">
            <td th:text="${item.title}"></td>
            <td th:text="${item.borrowCount}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
