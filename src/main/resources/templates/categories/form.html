<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thể loại')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container col-lg-6">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h3 mb-3" th:text="${categoryForm.id == null} ? 'Thêm thể loại' : 'Sửa thể loại'">Thể loại</h1>
    <form th:action="@{/categories}" th:object="${categoryForm}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Tên</label>
            <input class="form-control" th:field="*{name}">
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{active}">
            <label class="form-check-label">Đang dùng</label>
        </div>
        <button class="btn btn-primary" type="submit">Lưu</button>
    </form>
</main>
</body>
</html>
