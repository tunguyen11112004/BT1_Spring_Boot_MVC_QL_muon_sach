<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thành viên')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container col-lg-7">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h3 mb-3" th:text="${memberForm.id == null} ? 'Thêm thành viên' : 'Sửa thành viên'">Thành viên</h1>
    <form th:action="@{/members}" th:object="${memberForm}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input class="form-control" th:field="*{fullName}">
            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" th:field="*{email}">
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Điện thoại</label>
            <input class="form-control" th:field="*{phone}">
            <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select class="form-select" th:field="*{status}">
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Lưu</button>
    </form>
</main>
</body>
</html>
