<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thành viên')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between mb-3">
        <h1 class="h3">Thành viên</h1>
        <a class="btn btn-primary" th:href="@{/members/new}">Thêm thành viên</a>
    </div>
    <form class="row g-2 mb-3" method="get">
        <div class="col-md-3">
            <select class="form-select" name="status" onchange="this.form.submit()">
                <option value="">Mọi trạng thái</option>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == status}"></option>
            </select>
        </div>
    </form>
    <table class="table bg-white">
        <thead><tr><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody>
        <tr th:each="item : ${members.content}">
            <td th:text="${item.fullName}"></td>
            <td th:text="${item.email}"></td>
            <td th:text="${item.phone}"></td>
            <td th:text="${item.status}"></td>
            <td class="text-end">
                <a th:href="@{/members/{id}/edit(id=${item.id})}">Sửa</a>
                <form class="d-inline" th:action="@{/members/{id}/lock(id=${item.id})}" method="post">
                    <button class="btn btn-link p-0" type="submit" th:text="${item.status == 'BLOCKED'} ? 'Mở khóa' : 'Khóa'">Khóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" th:if="${members.hasPrevious()}"
           th:href="@{/members(page=${members.number - 1},size=${members.size},status=${status})}">Trước</a>
        <span th:text="'Trang ' + (${members.number} + 1) + ' / ' + ${members.totalPages == 0 ? 1 : members.totalPages}"></span>
        <a class="btn btn-outline-secondary btn-sm" th:if="${members.hasNext()}"
           th:href="@{/members(page=${members.number + 1},size=${members.size},status=${status})}">Sau</a>
    </div>
</main>
</body>
</html>
