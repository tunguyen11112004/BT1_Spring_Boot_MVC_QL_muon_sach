<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Thư viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Thư viện</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Sách</a>
            <a class="nav-link" th:href="@{/categories}">Thể loại</a>
            <a class="nav-link" th:href="@{/members}">Thành viên</a>
            <a class="nav-link" th:href="@{/borrowings}">Phiếu mượn</a>
            <a class="nav-link" th:href="@{/reports/overdue}">Quá hạn</a>
            <a class="nav-link" th:href="@{/reports/top-books}">Top sách</a>
            <a class="nav-link" th:href="@{/reports/members}">Lượt mượn</a>
        </div>
    </div>
</nav>
<div th:fragment="alerts" class="mb-3">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>
</body>
</html>
